spring:
  application:
    name: shreekamalinee

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shreekamalinee}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      # PRODUCTION NOTE: Change to 'validate' after first deployment once schema is stable.
      # Never use 'update' in production long-term — use Flyway or Liquibase migrations instead.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis Configuration for caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${CACHE_TYPE:redis}

  # Servlet / File Upload Configuration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:admin@shreekamalinee.com}
    password: ${MAIL_PASSWORD:gmail_app_password_placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000 # 5 seconds connection timeout
          timeout: 5000           # 5 seconds read timeout
          writetimeout: 5000      # 5 seconds write timeout

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google_client_id_placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google_client_secret_placeholder}

# Server Configuration
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework # Essential for reading real client IPs behind Cloudflare/Load Balancers
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024 # 1 KB
  error:
    whitelabel:
      enabled: false # Disables default Spring error page to use your GlobalExceptionHandler

# shreekamalinee Custom Security & Token Properties
shreekamalinee:
  jwt:
    # SECURITY: No default value. JWT_SECRET MUST be set as an environment variable in production.
    # If missing, JwtUtils @PostConstruct will throw an error on startup, preventing insecure launch.
    secret: ${JWT_SECRET}
    expirationMs: ${JWT_EXPIRATION:900000} # 15 Minutes for Access Token
    refreshExpirationMs: ${JWT_REFRESH_EXPIRATION:7776000000} # 90 Days for Refresh Token (90 * 24 * 60 * 60 * 1000)
  cookie:
    secure: ${COOKIE_SECURE:false} # false for local dev (http://localhost:5173 / 3000), true for production (https)
    same-site: ${COOKIE_SAME_SITE:Lax} # Lax for local dev, None for cross-site production
  # SECURITY: No default value. HMAC_SECRET MUST be set as an environment variable in production.
  hmac-secret: ${HMAC_SECRET}

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Razorpay Configuration
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_1234567890abcdef}
    secret: ${RAZORPAY_KEY_SECRET:razorpay_secret_placeholder}

# Supabase Storage Configuration
supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:shreekamalinee}

# Application Custom Configurations (Unified Root Block)
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://renaissance-zeta.vercel.app}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:onboarding@resend.dev}}
  admin:
    email: ${ADMIN_EMAIL:admin@shreekamalinee.com}
    password: ${ADMIN_PASSWORD:Admin@ShreeKamalinee2026}
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:${ADMIN_EMAIL:admin@shreekamalinee.com}}