spring:
  application:
    name: shreekamalinee

  # Database Configuration — environment variables with local defaults
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shreekamalinee_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      # PRODUCTION NOTE: Change to 'validate' after first deployment once schema is stable.
      # Never use 'update' in production long-term — use Flyway or Liquibase migrations instead.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis Configuration for caching — environment variables with local defaults
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  cache:
    type: ${CACHE_TYPE:none}

  # Servlet / File Upload Configuration (technical limits, not secrets)
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  # Mail Configuration — environment variables with local defaults
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000 # 5 seconds connection timeout
          timeout: 5000           # 5 seconds read timeout
          writetimeout: 5000      # 5 seconds write timeout

  # OAuth2 Configuration — environment variables with local defaults
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}

# Server Configuration — port with default 8090
server:
  port: ${PORT:8090}
  forward-headers-strategy: framework # Essential for reading real client IPs behind Cloudflare/Load Balancers
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024 # 1 KB
  error:
    whitelabel:
      enabled: false # Disables default Spring error page to use your GlobalExceptionHandler

# shreekamalinee Custom Security & Token Properties — environment variables with local defaults
shreekamalinee:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expirationMs: ${JWT_EXPIRATION:86400000}
    refreshExpirationMs: ${JWT_REFRESH_EXPIRATION:604800000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  hmac-secret: ${HMAC_SECRET:supersecretkeyforhmacverification1234567890}

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Razorpay Configuration — environment variables with local defaults
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    secret: ${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}

# Supabase Storage Configuration — environment variables with local defaults
supabase:
  url: ${SUPABASE_URL:https://placeholder.supabase.co}
  key: ${SUPABASE_KEY:placeholder-supabase-key}
  bucket: ${SUPABASE_BUCKET:shreekamalinee-products}

# Application Custom Configurations — environment variables with local defaults
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}
  admin:
    email: ${ADMIN_EMAIL:admin@shreekamalinee.com}
    password: ${ADMIN_PASSWORD:Admin@123456}
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:admin@shreekamalinee.com}

# SpringDoc / Swagger OpenAPI Configuration
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}