spring:
  application:
    name: RENAISSANCE

  # Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Servlet / File Upload Configuration (Crucial for NID/NIFT PDFs)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

# Server Configuration
server:
  port: ${PORT}
  error:
    whitelabel:
      enabled: false # Disables default Spring error page to use your GlobalExceptionHandler

# Renaissance Custom Properties
renaissance:
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: ${JWT_EXPIRATION}
  # Matches @Value("${renaissance.hmac-secret}") in CatalogServiceImpl
  hmac-secret: ${HMAC_SECRET}

# Razorpay Configuration
razorpay:
    key:
      id: ${RAZORPAY_KEY_ID}
      secret: ${RAZORPAY_KEY_SECRET}
