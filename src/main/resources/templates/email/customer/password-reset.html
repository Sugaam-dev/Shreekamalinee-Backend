<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:replace="~{email/layout/base-layout :: main(~{::#pwdResetContent})}">
    <div id="pwdResetContent">
      <h2 style="color: #7b121c; margin-top: 0; font-family: Georgia, serif;">Reset Your Password</h2>
      <p>Namaste,</p>
      <p>We received a request to reset your password for your <strong>Shreekamalinee</strong> account. Use the code below to choose a new password:</p>
      <div style="display: block; width: fit-content; margin: 25px auto; padding: 15px 30px; background-color: #fcebeb; border: 2px dashed #7b121c; border-radius: 8px; font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #7b121c; text-align: center;" th:text="${otp}">123456</div>
      <p>This code expires in <strong>10 minutes</strong>. If you did not make this request, your account is safe and you can ignore this email.</p>
    </div>
  </div>
</body>
</html>
