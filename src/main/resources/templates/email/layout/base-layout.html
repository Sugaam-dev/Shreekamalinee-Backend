<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title th:text="${emailSubject}">Shreekamalinee</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; color: #333333; }
    table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    .wrapper { width: 100%; max-width: 680px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid #e9ecef; }
    .header { background: linear-gradient(135deg, #7b121c 0%, #4a050d 100%); padding: 26px 16px; text-align: center; color: #ffffff; }
    .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1.5px; font-family: Georgia, serif; white-space: nowrap !important; word-break: keep-all !important; color: #ffffff; }
    .header p { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #d4af37; white-space: nowrap !important; word-break: keep-all !important; }
    .content { padding: 32px 26px; font-size: 15px; line-height: 1.6; color: #333333; }
    .footer { background-color: #f8f9fa; padding: 22px 16px; text-align: center; font-size: 12px; color: #888888; border-top: 1px solid #edf2f7; line-height: 1.5; }
    .footer a { color: #7b121c; text-decoration: none; font-weight: 600; }
    @media only screen and (max-width: 600px) {
      .wrapper { width: 100% !important; max-width: 100% !important; margin: 0 auto !important; border-radius: 0 !important; border: none !important; }
      .header { padding: 20px 10px !important; }
      .header h1 { font-size: 20px !important; letter-spacing: 1px !important; white-space: nowrap !important; word-break: keep-all !important; }
      .header p { font-size: 10px !important; letter-spacing: 1.5px !important; white-space: nowrap !important; }
      .content { padding: 20px 14px !important; font-size: 14px !important; }
      .footer { padding: 18px 10px !important; font-size: 11px !important; }
    }
  </style>
</head>
<body>
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f4f6f8; margin: 0; padding: 0;">
    <tr>
      <td align="center" style="padding: 10px 0;">
        <div class="wrapper">
          <div class="header">
            <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1.5px; font-family: Georgia, serif; white-space: nowrap !important; word-break: keep-all !important; color: #ffffff;">SHREEKAMALINEE</h1>
            <p style="margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #d4af37; white-space: nowrap !important; word-break: keep-all !important;">Luxury Handloom Sarees</p>
          </div>
          <div class="content" th:fragment="main(contentBody)">
            <div th:replace="${contentBody}">
              <!-- Dynamic Content -->
            </div>
          </div>
          <div class="footer">
            <p style="margin: 0 0 6px; word-break: keep-all;">© 2026 Shreekamalinee Luxury Sarees. Handcrafted with Heritage.</p>
            <p style="margin: 0;">Visit <a th:href="${supportUrl ?: 'https://www.shreekamalinee.com'}" style="color: #7b121c; text-decoration: none; font-weight: 600; white-space: nowrap;">shreekamalinee.com</a> | Helpline: <a href="mailto:support@shreekamalinee.com" style="color: #7b121c; text-decoration: none; font-weight: 600; white-space: nowrap;">support@shreekamalinee.com</a></p>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
