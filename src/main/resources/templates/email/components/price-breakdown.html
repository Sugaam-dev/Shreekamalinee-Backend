<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="breakdown" style="background-color: #faf8f5; border: 1px solid #e8e2d9; border-radius: 8px; padding: 16px; margin: 18px 0; box-sizing: border-box;">
    <h4 style="margin: 0 0 12px; color: #800020; font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #ede6dc; padding-bottom: 6px;">Financial & Cost Breakdown</h4>
    
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="font-size: 13.5px; width: 100%;">
      <!-- Subtotal -->
      <tr>
        <td align="left" style="padding: 4px 0; color: #444;">Items Subtotal:</td>
        <td align="right" style="padding: 4px 0; text-align: right; color: #222; font-weight: 700; white-space: nowrap;" th:text="${subtotalFormatted}">₹0.00</td>
      </tr>

      <!-- Coupon Discount -->
      <tr th:if="${discount != null && discount > 0}">
        <td align="left" style="padding: 4px 0; color: #27ae60;">
          <span th:text="${couponCode != null && !#strings.isEmpty(couponCode) ? 'Coupon Discount (' + #strings.toUpperCase(couponCode) + '):' : 'Coupon Discount:'}">Coupon Discount:</span>
        </td>
        <td align="right" style="padding: 4px 0; text-align: right; color: #27ae60; font-weight: 700; white-space: nowrap;" th:text="'-' + ${discountFormatted}">-₹0.00</td>
      </tr>

      <!-- Shipping Fee -->
      <tr>
        <td align="left" style="padding: 4px 0; color: #444;">Insured Shipping & Delivery:</td>
        <td align="right" style="padding: 4px 0; text-align: right; color: #222; white-space: nowrap;">
          <span th:if="${shippingFee == null || shippingFee == 0}" style="color: #27ae60; font-weight: 700;">FREE</span>
          <span th:if="${shippingFee != null && shippingFee > 0}" th:text="${shippingFormatted}">₹99.00</span>
        </td>
      </tr>

      <!-- COD Handling Fee -->
      <tr th:if="${codFee != null && codFee > 0}">
        <td align="left" style="padding: 4px 0; color: #d35400;">COD Handling Charge:</td>
        <td align="right" style="padding: 4px 0; text-align: right; color: #d35400; font-weight: 700; white-space: nowrap;" th:text="'+' + ${codFeeFormatted}">+₹0.00</td>
      </tr>

      <!-- Grand Total -->
      <tr>
        <td align="left" style="padding: 10px 0 4px; border-top: 2px solid #ddd; font-size: 16px; color: #800020; font-weight: 700;">Grand Total Payable:</td>
        <td align="right" style="padding: 10px 0 4px; border-top: 2px solid #ddd; text-align: right; font-size: 16px; color: #800020; font-weight: 700; white-space: nowrap;" th:text="${finalTotalFormatted}">₹0.00</td>
      </tr>
    </table>

    <!-- Formula line -->
    <div style="margin-top: 10px; padding: 8px 10px; background-color: #f1ede6; border-radius: 4px; font-size: 12px; color: #555; word-break: normal;">
      <strong>Formula:</strong> <span th:text="${formulaText}">Subtotal - Discount + Shipping + COD = Total</span>
    </div>

    <!-- Payment Mode & Status -->
    <div style="margin-top: 10px; font-size: 12.5px; color: #666;">
      Payment Mode: <strong th:text="${paymentMethodDisplay}">Online</strong> | Status: <strong th:style="${'color: ' + paymentStatusColor + ';'}" th:text="${paymentStatus}">PAID</strong>
    </div>
  </div>
</body>
</html>
