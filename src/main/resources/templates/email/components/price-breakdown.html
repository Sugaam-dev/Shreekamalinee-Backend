<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="breakdown" style="background-color: #FAF7F2; border: 1px solid #EADBCE; border-radius: 8px; padding: 20px; margin: 18px 0; box-sizing: border-box;">
    <h4 style="margin: 0 0 14px; color: #800020; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #EADBCE; padding-bottom: 8px; font-family: 'Playfair Display', Georgia, serif;">Price & Settlement Summary</h4>
    
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="font-size: 13.5px; width: 100%;">
      <!-- Subtotal -->
      <tr>
        <td align="left" style="padding: 5px 0; color: #6E5D53;">Items Subtotal:</td>
        <td align="right" style="padding: 5px 0; text-align: right; color: #221D1B; font-weight: 600; white-space: nowrap;" th:text="${subtotalFormatted}">₹0.00</td>
      </tr>

      <!-- Coupon Discount -->
      <tr th:if="${discount != null && discount > 0}">
        <td align="left" style="padding: 5px 0; color: #059669;">
          <span style="display: inline-block; padding: 1px 6px; background-color: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 4px; font-size: 11.5px; font-weight: 700;" th:text="${couponCode != null && !#strings.isEmpty(couponCode) ? '🏷️ ' + #strings.toUpperCase(couponCode) : '🏷️ Coupon Discount'}">🏷️ Coupon</span>
        </td>
        <td align="right" style="padding: 5px 0; text-align: right; color: #059669; font-weight: 700; white-space: nowrap;" th:text="'-' + ${discountFormatted}">-₹0.00</td>
      </tr>

      <!-- Shipping Fee -->
      <tr>
        <td align="left" style="padding: 5px 0; color: #6E5D53;">Insured Artisan Dispatch:</td>
        <td align="right" style="padding: 5px 0; text-align: right; color: #221D1B; white-space: nowrap;">
          <span th:if="${shippingFee == null || shippingFee == 0}" style="display: inline-block; padding: 1px 6px; background-color: #ECFDF5; color: #059669; border-radius: 4px; font-size: 11px; font-weight: 700;">FREE DELIVERY</span>
          <span th:if="${shippingFee != null && shippingFee > 0}" th:text="${shippingFormatted}" style="font-weight: 600;">₹99.00</span>
        </td>
      </tr>

      <!-- COD Handling Fee -->
      <tr th:if="${codFee != null && codFee > 0}">
        <td align="left" style="padding: 5px 0; color: #D97706;">COD Collection Fee:</td>
        <td align="right" style="padding: 5px 0; text-align: right; color: #D97706; font-weight: 700; white-space: nowrap;" th:text="'+' + ${codFeeFormatted}">+₹0.00</td>
      </tr>

      <!-- Grand Total -->
      <tr>
        <td align="left" style="padding: 12px 0 4px; border-top: 2px solid #EADBCE; font-size: 15.5px; color: #800020; font-weight: 700; font-family: 'Playfair Display', Georgia, serif;">Total Amount:</td>
        <td align="right" style="padding: 12px 0 4px; border-top: 2px solid #EADBCE; text-align: right; font-size: 16px; color: #800020; font-weight: 700; white-space: nowrap;" th:text="${finalTotalFormatted}">₹0.00</td>
      </tr>
    </table>

    <!-- Payment Mode & Status Footer Bar -->
    <div style="margin-top: 14px; padding-top: 10px; border-top: 1px dashed #EADBCE; font-size: 12px; color: #6E5D53; display: flex; justify-content: space-between; align-items: center;">
      <div>Payment Method: <strong style="color: #221D1B;" th:text="${paymentMethodDisplay}">Online</strong></div>
      <div style="margin-top: 4px;">Status: <span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; text-transform: uppercase;" th:style="${'background-color: #FAF7F2; border: 1px solid ' + paymentStatusColor + '; color: ' + paymentStatusColor + ';'}" th:text="${paymentStatus}">PAID</span></div>
    </div>
  </div>
</body>
</html>
