<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="itemsTable" style="margin: 15px 0;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;">
      <thead>
        <tr style="background-color: #f7f7f7; text-align: left; font-size: 12px; color: #666; text-transform: uppercase;">
          <th style="padding: 10px 12px;">Saree / Apparel</th>
          <th style="padding: 10px 12px; text-align: center;">Qty</th>
          <th style="padding: 10px 12px; text-align: right;">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${orderItems}" style="border-bottom: 1px solid #eee;">
          <td style="padding: 12px; word-break: break-word;">
            <strong th:text="${item.productName}">Handloom Saree</strong>
            <div th:if="${item.variantInfo != null && !#strings.isEmpty(item.variantInfo)}" style="font-size: 12px; color: #888;" th:text="${item.variantInfo}">Free Size Standard</div>
          </td>
          <td style="padding: 12px; text-align: center; white-space: nowrap;" th:text="${item.quantity}">1</td>
          <td style="padding: 12px; text-align: right; white-space: nowrap;">
            <strong th:text="${item.totalPriceFormatted}">₹0.00</strong>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(orderItems)}">
          <td colspan="3" style="padding: 12px; text-align: center; color: #888;">No items recorded.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
