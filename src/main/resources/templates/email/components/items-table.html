<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="itemsTable" style="margin: 14px 0 18px;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #EADBCE; border-radius: 8px; overflow: hidden; background-color: #FFFFFF;">
      <thead>
        <tr style="background-color: #FAF7F2; border-bottom: 1px solid #EADBCE; text-align: left; font-size: 11px; font-weight: 700; color: #8A7E77; text-transform: uppercase; letter-spacing: 1px;">
          <th style="padding: 12px 14px; border-bottom: 1px solid #EADBCE;">Handloom Ensemble</th>
          <th style="padding: 12px 10px; text-align: center; border-bottom: 1px solid #EADBCE;">Qty</th>
          <th style="padding: 12px 14px; text-align: right; border-bottom: 1px solid #EADBCE;">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item, iterStat : ${orderItems}" th:style="${iterStat.last ? '' : 'border-bottom: 1px solid #F0E8DF;'}">
          <td style="padding: 14px; vertical-align: top; border-bottom: 1px solid #F0E8DF;">
            <div style="font-weight: 700; color: #221D1B; font-size: 14px;" th:text="${item.productName}">Handcrafted Paithani Silk Saree</div>
            <div th:if="${item.variantInfo != null && !#strings.isEmpty(item.variantInfo)}" style="margin-top: 4px; display: inline-block; padding: 2px 8px; background-color: #F6F1EA; border-radius: 4px; font-size: 11px; font-weight: 600; color: #800020;" th:text="${item.variantInfo}">Standard Saree with Blouse Piece</div>
          </td>
          <td style="padding: 14px 10px; text-align: center; vertical-align: top; font-weight: 600; color: #524741; font-size: 13.5px; border-bottom: 1px solid #F0E8DF;" th:text="${item.quantity}">1</td>
          <td style="padding: 14px; text-align: right; vertical-align: top; white-space: nowrap; font-weight: 700; color: #221D1B; font-size: 14px; border-bottom: 1px solid #F0E8DF;" th:text="${item.totalPriceFormatted}">₹0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(orderItems)}">
          <td colspan="3" style="padding: 18px; text-align: center; color: #9E928A; font-style: italic;">No specific items recorded for this order snapshot.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
